name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skills:
    name: Validate skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check ShellCheck is available
        run: shellcheck --version

      - name: Validate skills
        run: python3 .github/scripts/validate-skills.py
